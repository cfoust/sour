<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sour Map Preview Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #1a1a2e;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #app {
      display: flex;
      height: 100vh;
    }
    #sidebar {
      width: 200px;
      background: #0f1729;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2a2a4a;
      flex-shrink: 0;
    }
    #search {
      width: 100%;
      padding: 10px 16px;
      background: #1a2540;
      border: none;
      border-bottom: 1px solid #2a2a4a;
      color: #eee;
      font-size: 14px;
      outline: none;
    }
    #search::placeholder { color: #556; }
    #map-list {
      overflow-y: auto;
      flex: 1;
    }
    .map-item {
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
      text-transform: capitalize;
      border-bottom: 1px solid #1a1a3a;
      transition: background 0.15s;
    }
    .map-item:hover { background: #1a2540; }
    .map-item.active {
      background: #1e3a5f;
      color: #00d4ff;
      font-weight: 600;
    }
    #main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #viewer {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
    #hud {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
    }
    #clip-slider {
      width: 160px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
